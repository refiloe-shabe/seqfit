name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-ml-image:
    uses: instadeepai/mlops-reusable-ci/.github/workflows/docker-build.yaml@main
    with:
      display-name: ML Image 🏗️
      image: ghcr.io/instadeepai/ml-research-template/ml_template
      cache-image: ghcr.io/instadeepai/ml-research-template/ml_template/cache
      build-path: . #project root
      filename: "Dockerfile"
      build-args: |
        ACCELERATOR=cpu
      registry-host: ghcr.io
      registry-username: ${{ github.actor }}
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
      dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-test-image:
    uses: instadeepai/mlops-reusable-ci/.github/workflows/docker-build.yaml@main
    with:
      display-name: Test Image 🏛️
      image: ghcr.io/instadeepai/ml-research-template/test
      cache-image: ghcr.io/instadeepai/ml-research-template/test/cache
      build-path: . #project root
      filename: "Dockerfile.test"
      registry-host: ghcr.io
      registry-username: ${{ github.actor }}
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
      dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  linters:
    needs: build-test-image
    runs-on: instadeep-ci
    container:
       image: ghcr.io/instadeepai/ml-research-template/test:${{ github.sha }}
    steps:
      - name: checkout code 📦
        uses: actions/checkout@v4

      # Workaround for https://github.com/actions/checkout/issues/1169
      - run: git config --system --add safe.directory $GITHUB_WORKSPACE

      - name: Run linters 🖌️
        run: |
           pre-commit run --all-files --verbose

  tests:
    needs: build-test-image
    runs-on: instadeep-ci
    container:
       image: ghcr.io/instadeepai/ml-research-template/test:${{ github.sha }}
    steps:
      - name: checkout code 📦
        uses: actions/checkout@v4

      - name: Run tests 🧪
        run: |
           pytest --verbose ml_research_template
